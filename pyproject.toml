[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cuttycat"
version = "0.1.0"
description = "Split a full album, DJ mix or playlist rip into tracks at the gaps"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PySide6>=6.5", "numpy"]

[project.optional-dependencies]
youtube = ["yt-dlp"]
ogg-covers = ["mutagen"]
all = ["yt-dlp", "mutagen"]

[project.gui-scripts]
cuttycat = "cuttycat.app:main"

[tool.setuptools]
packages = ["cuttycat", "cuttycat.assets", "cuttycat.assets.fonts"]

[tool.setuptools.package-data]
cuttycat = ["assets/*.png", "assets/fonts/*"]
